# Incluir em http{}. HTTP interno; TLS/DNS/certificado devem ser definidos pela ATI.
server {
    listen 8080;
    server_name _;
    root /srv/prgd/current;
    index index.html;
    server_tokens off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
    # API institucional ainda não implementada; não mascarar como HTML.
    location /api/ { return 404; }
}
