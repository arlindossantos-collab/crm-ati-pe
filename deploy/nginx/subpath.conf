# Copiar/ligar dist para /srv/prgd/www/prgd; o build usa URLs relativas.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    add_header Cache-Control "no-cache" always;
    root /srv/prgd/www;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /prgd { return 301 /prgd/; }
    location /prgd/ { try_files $uri $uri/ =404; }
    location / { return 404; }
    location ~ /\. { deny all; }
    location /api/ { return 404; }
}
