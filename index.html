<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Relacionamento ATI-PE | Governo Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- Header / Navbar -->
    <header class="bg-blue-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-blue-900 px-3 py-1.5 rounded-lg font-bold text-xl tracking-wider">ATI</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">CRM Relacionamento de Governo Digital</h1>
                    <p class="text-xs text-blue-200">Agência Estadual de Tecnologia da Informação de Pernambuco</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="abrirModalOrgao()" class="bg-blue-800 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-building-circle-check"></i> Novo Órgão
                </button>
                <button onclick="abrirModalDemanda()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-plus"></i> Nova Demanda
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Órgãos do Estado</p>
                    <h3 id="kpi-orgaos" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="p-3 bg-blue-50 text-blue-700 rounded-xl">
                    <i class="fa-solid fa-landmark text-xl"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Demandas</p>
                    <h3 id="kpi-demandas" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                </div>
                <div class="p-3 bg-amber-50 text-amber-600 rounded-xl">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Em Andamento</p>
                    <h3 id="kpi-andamento" class="text-2xl font-bold text-blue-600 mt-1">0</h3>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-xl">
                    <i class="fa-solid fa-spinner text-xl"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Concluídas</p>
                    <h3 id="kpi-concluidas" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl">
                    <i class="fa-solid fa-circle-check text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Toolbar: Tabs & Filter -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div class="flex bg-slate-200 p-1 rounded-xl w-fit">
                <button id="btn-tab-demandas" onclick="mudarAba('demandas')" class="px-4 py-2 rounded-lg text-sm font-semibold transition bg-white text-blue-900 shadow-sm">
                    <i class="fa-solid fa-tasks mr-1.5"></i> Demandas & Projetos
                </button>
                <button id="btn-tab-orgaos" onclick="mudarAba('orgaos')" class="px-4 py-2 rounded-lg text-sm font-semibold transition text-slate-600 hover:text-slate-900">
                    <i class="fa-solid fa-building mr-1.5"></i> Órgãos Cadastrados
                </button>
            </div>
            <div class="relative w-full md:w-80">
                <input type="text" id="input-busca" onkeyup="filtrarConteudo()" placeholder="Buscar por órgão, projeto, sigla..." class="w-full pl-10 pr-4 py-2 text-sm bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none shadow-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
            </div>
        </div>

        <!-- TAB 1: DEMANDAS E PROJETOS -->
        <div id="aba-demandas" class="block">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 uppercase font-semibold">
                        <tr>
                            <th class="p-4">Órgão</th>
                            <th class="p-4">Título / Demanda</th>
                            <th class="p-4">Categoria</th>
                            <th class="p-4">Prioridade</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-demandas" class="divide-y divide-slate-100 text-sm">
                        <!-- Render via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: ÓRGÃOS -->
        <div id="aba-orgaos" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="cards-orgaos">
                <!-- Render via JS -->
            </div>
        </div>

    </main>

    <!-- MODAL NOVO ÓRGÃO -->
    <div id="modal-orgao" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900">Cadastrar Novo Órgão</h3>
                <button onclick="fecharModal('modal-orgao')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="form-orgao" onsubmit="salvarOrgao(event)">
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Nome do Órgão / Secretaria</label>
                        <input type="text" id="org-nome" required placeholder="Ex: Secretaria da Fazenda" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Sigla</label>
                        <input type="text" id="org-sigla" required placeholder="Ex: SEFAZ" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Contato Principal</label>
                        <input type="text" id="org-contato" required placeholder="Nome do gestor ou ponto focal" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">E-mail Institucional</label>
                        <input type="email" id="org-email" required placeholder="contato@orgao.pe.gov.br" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="fecharModal('modal-orgao')" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm font-medium">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-900 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition">Salvar Órgão</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL NOVA DEMANDA -->
    <div id="modal-demanda" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900">Nova Demanda / Projeto</h3>
                <button onclick="fecharModal('modal-demanda')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="form-demanda" onsubmit="salvarDemanda(event)">
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Órgão Solicitante</label>
                        <select id="dem-orgao" required class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                            <!-- Populado via JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Título da Demanda</label>
                        <input type="text" id="dem-titulo" required placeholder="Ex: Migração de E-mails SOGo" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Categoria</label>
                        <select id="dem-categoria" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                            <option value="Infraestrutura / E-mail">Infraestrutura / E-mail</option>
                            <option value="Transformação Digital">Transformação Digital</option>
                            <option value="Sistemas / Web">Sistemas / Web</option>
                            <option value="Capacitação & Treinamento">Capacitação & Treinamento</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Prioridade</label>
                        <select id="dem-prioridade" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                            <option value="Baixa">Baixa</option>
                            <option value="Média" selected>Média</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Status Inicial</label>
                        <select id="dem-status" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                            <option value="Pendente">Pendente</option>
                            <option value="Em Andamento" selected>Em Andamento</option>
                            <option value="Concluído">Concluído</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="fecharModal('modal-demanda')" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm font-medium">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-500 transition">Cadastrar Demanda</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let state = {
            orgaos: JSON.parse(localStorage.getItem('ati_crm_orgaos')) || [
                { id: '1', nome: 'Secretaria da Fazenda', sigla: 'SEFAZ', contato: 'Carlos Eduardo', email: 'carlos@sefaz.pe.gov.br' },
                { id: '2', nome: 'Secretaria de Planejamento e Gestão', sigla: 'SEPLAG', contato: 'Mariana Lima', email: 'mariana@seplag.pe.gov.br' },
                { id: '3', nome: 'Secretaria de Educação', sigla: 'SEE', contato: 'Roberto Mendes', email: 'roberto@see.pe.gov.br' }
            ],
            demandas: JSON.parse(localStorage.getItem('ati_crm_demandas')) || [
                { id: '101', orgaoId: '1', titulo: 'Migração de E-mails Expresso -> SOGo.PE', categoria: 'Infraestrutura / E-mail', prioridade: 'Alta', status: 'Em Andamento' },
                { id: '102', orgaoId: '2', titulo: 'Adesão ao Projeto Residência Digital', categoria: 'Transformação Digital', prioridade: 'Média', status: 'Concluído' },
                { id: '103', orgaoId: '3', titulo: 'Atualização do Portal Institucional', categoria: 'Sistemas / Web', prioridade: 'Baixa', status: 'Pendente' }
            ]
        };

        function saveData() {
            localStorage.setItem('ati_crm_orgaos', JSON.stringify(state.orgaos));
            localStorage.setItem('ati_crm_demandas', JSON.stringify(state.demandas));
            render();
        }

        function render() {
            // KPIs
            document.getElementById('kpi-orgaos').innerText = state.orgaos.length;
            document.getElementById('kpi-demandas').innerText = state.demandas.length;
            document.getElementById('kpi-andamento').innerText = state.demandas.filter(d => d.status === 'Em Andamento').length;
            document.getElementById('kpi-concluidas').innerText = state.demandas.filter(d => d.status === 'Concluído').length;

            // Render Demandas Table
            const tabela = document.getElementById('tabela-demandas');
            if (state.demandas.length === 0) {
                tabela.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">Nenhuma demanda cadastrada.</td></tr>`;
            } else {
                tabela.innerHTML = state.demandas.map(d => {
                    const org = state.orgaos.find(o => o.id === d.orgaoId) || { sigla: 'N/A' };
                    const badgeColor = d.status === 'Concluído' ? 'bg-emerald-100 text-emerald-800' : d.status === 'Em Andamento' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800';
                    const prioColor = d.prioridade === 'Alta' ? 'text-red-600 font-bold' : d.prioridade === 'Média' ? 'text-amber-600 font-medium' : 'text-slate-500';
                    return `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-4 font-bold text-blue-950">${org.sigla}</td>
                            <td class="p-4 font-medium text-slate-900">${d.titulo}</td>
                            <td class="p-4 text-slate-500 text-xs">${d.categoria}</td>
                            <td class="p-4 ${prioColor} text-xs">${d.prioridade}</td>
                            <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeColor}">${d.status}</span></td>
                            <td class="p-4 text-center">
                                <button onclick="alternarStatus('${d.id}')" class="text-slate-400 hover:text-blue-600 p-1.5 transition" title="Alternar Status">
                                    <i class="fa-solid fa-rotate"></i>
                                </button>
                                <button onclick="excluirDemanda('${d.id}')" class="text-slate-400 hover:text-red-600 p-1.5 transition" title="Excluir">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            // Render Orgaos Cards
            const containerOrgaos = document.getElementById('cards-orgaos');
            if (state.orgaos.length === 0) {
                containerOrgaos.innerHTML = `<p class="col-span-3 text-center text-slate-400 py-6">Nenhum órgão cadastrado.</p>`;
            } else {
                containerOrgaos.innerHTML = state.orgaos.map(o => `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="bg-blue-100 text-blue-900 text-xs font-bold px-2.5 py-0.5 rounded-md">${o.sigla}</span>
                                <h4 class="font-bold text-slate-800 mt-2">${o.nome}</h4>
                            </div>
                        </div>
                        <div class="text-xs text-slate-600 space-y-1.5 border-t border-slate-100 pt-3">
                            <p class="flex items-center gap-2"><i class="fa-solid fa-user text-slate-400"></i> ${o.contato}</p>
                            <p class="flex items-center gap-2"><i class="fa-solid fa-envelope text-slate-400"></i> ${o.email}</p>
                        </div>
                    </div>
                `).join('');
            }

            // Populate Modal Select
            const selectOrg = document.getElementById('dem-orgao');
            selectOrg.innerHTML = state.orgaos.map(o => `<option value="${o.id}">${o.sigla} - ${o.nome}</option>`).join('');
        }

        function mudarAba(aba) {
            if(aba === 'demandas') {
                document.getElementById('aba-demandas').classList.remove('hidden');
                document.getElementById('aba-orgaos').classList.add('hidden');
                document.getElementById('btn-tab-demandas').className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-white text-blue-900 shadow-sm";
                document.getElementById('btn-tab-orgaos').className = "px-4 py-2 rounded-lg text-sm font-semibold transition text-slate-600 hover:text-slate-900";
            } else {
                document.getElementById('aba-demandas').classList.add('hidden');
                document.getElementById('aba-orgaos').classList.remove('hidden');
                document.getElementById('btn-tab-orgaos').className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-white text-blue-900 shadow-sm";
                document.getElementById('btn-tab-demandas').className = "px-4 py-2 rounded-lg text-sm font-semibold transition text-slate-600 hover:text-slate-900";
            }
        }

        function abrirModalOrgao() { document.getElementById('modal-orgao').classList.remove('hidden'); }
        function abrirModalDemanda() { document.getElementById('modal-demanda').classList.remove('hidden'); }
        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }

        function salvarOrgao(e) {
            e.preventDefault();
            const novo = {
                id: Date.now().toString(),
                nome: document.getElementById('org-nome').value,
                sigla: document.getElementById('org-sigla').value,
                contato: document.getElementById('org-contato').value,
                email: document.getElementById('org-email').value
            };
            state.orgaos.push(novo);
            saveData();
            fecharModal('modal-orgao');
            document.getElementById('form-orgao').reset();
        }

        function salvarDemanda(e) {
            e.preventDefault();
            const nova = {
                id: Date.now().toString(),
                orgaoId: document.getElementById('dem-orgao').value,
                titulo: document.getElementById('dem-titulo').value,
                categoria: document.getElementById('dem-categoria').value,
                prioridade: document.getElementById('dem-prioridade').value,
                status: document.getElementById('dem-status').value
            };
            state.demandas.push(nova);
            saveData();
            fecharModal('modal-demanda');
            document.getElementById('form-demanda').reset();
        }

        function alternarStatus(id) {
            const d = state.demandas.find(item => item.id === id);
            if(d) {
                if(d.status === 'Pendente') d.status = 'Em Andamento';
                else if(d.status === 'Em Andamento') d.status = 'Concluído';
                else d.status = 'Pendente';
                saveData();
            }
        }

        function excluirDemanda(id) {
            state.demandas = state.demandas.filter(d => d.id !== id);
            saveData();
        }

        function filtrarConteudo() {
            const query = document.getElementById('input-busca').value.toLowerCase();
            const linhas = document.querySelectorAll('#tabela-demandas tr');
            linhas.forEach(tr => {
                const text = tr.innerText.toLowerCase();
                tr.style.display = text.includes(query) ? '' : 'none';
            });
        }

        render();
    </script>
</body>
</html>
