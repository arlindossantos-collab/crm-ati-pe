<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Card PNG - Gestão de Links ATI</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1e1e2f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #ffffff;
        }

        .controls-panel {
            background-color: #2b2b3d;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #d0e1f9;
        }

        select, input[type="date"] {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444466;
            background-color: #181824;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .btn-download {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-download:hover {
            background-color: #218838;
        }

        canvas {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="controls-panel">
        <div class="form-group">
            <label for="modeSelect">Modo de Exibição da Data/Período:</label>
            <select id="modeSelect" onchange="toggleMode()">
                <option value="specific">1. Data Específica</option>
                <option value="weekday">2. Dia da Semana (Segunda a Sexta)</option>
            </select>
        </div>

        <div class="form-group" id="specificGroup">
            <label for="dateInput">Escolha a Data Específica:</label>
            <input type="date" id="dateInput" onchange="updateCanvas()">
        </div>

        <div class="form-group" id="weekdayGroup" style="display: none;">
            <label for="weekdaySelect">Escolha o Dia da Semana:</label>
            <select id="weekdaySelect" onchange="updateCanvas()">
                <option value="Segunda-feira">Segunda-feira</option>
                <option value="Terça-feira">Terça-feira</option>
                <option value="Quarta-feira">Quarta-feira</option>
                <option value="Quinta-feira">Quinta-feira</option>
                <option value="Sexta-feira">Sexta-feira</option>
            </select>
        </div>

        <button class="btn-download" onclick="downloadPNG()">💾 Baixar Card (.PNG)</button>
    </div>

    <canvas id="cardCanvas" width="600" height="740"></canvas>

    <script>
        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');

        // Set default date to today
        document.getElementById('dateInput').valueAsDate = new Date();

        function toggleMode() {
            const mode = document.getElementById('modeSelect').value;
            if (mode === 'specific') {
                document.getElementById('specificGroup').style.display = 'flex';
                document.getElementById('weekdayGroup').style.display = 'none';
            } else {
                document.getElementById('specificGroup').style.display = 'none';
                document.getElementById('weekdayGroup').style.display = 'flex';
            }
            updateCanvas();
        }

        function getFormattedDateLabel() {
            const mode = document.getElementById('modeSelect').value;

            if (mode === 'specific') {
                const dateVal = document.getElementById('dateInput').value;
                if (!dateVal) return 'Data: Não definida';
                const parts = dateVal.split('-');
                return `Data do Procedimento: ${parts[2]}/${parts[1]}/${parts[0]}`;
            } else {
                const weekday = document.getElementById('weekdaySelect').value;
                return `Validade Semanal: ${weekday}`;
            }
        }

        function updateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Card Background
            ctx.fillStyle = '#FFFFFF';
            roundRect(ctx, 0, 0, 600, 740, 16, true, false);

            // Header Background
            const grad = ctx.createLinearGradient(0, 0, 600, 0);
            grad.addColorStop(0, '#003366');
            grad.addColorStop(1, '#0055A5');
            ctx.fillStyle = grad;
            roundRectTop(ctx, 0, 0, 600, 100, 16);

            // Header Text
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 22px "Segoe UI", Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GESTÃO DE LINKS ATI', 300, 45);

            ctx.font = '14px "Segoe UI", Arial';
            ctx.fillStyle = '#D0E1F9';
            ctx.fillText('Guia Rápido de Atualização da Página Inicial', 300, 72);

            // Date / Schedule Badge (Destaque da escolha)
            const dateText = getFormattedDateLabel();
            ctx.fillStyle = '#E2E8F0';
            roundRect(ctx, 160, 112, 280, 26, 13, true, false);
            ctx.fillStyle = '#1A202C';
            ctx.font = 'bold 12px "Segoe UI", Arial';
            ctx.fillText(dateText, 300, 129);

            // Info Box Background
            ctx.fillStyle = '#EEF6FF';
            roundRect(ctx, 30, 150, 540, 46, 8, true, false);
            ctx.fillStyle = '#0055A5';
            ctx.fillRect(30, 150, 6, 46);

            // Info Box Content
            ctx.textAlign = 'left';
            ctx.font = 'bold 13px "Segoe UI", Arial';
            ctx.fillStyle = '#003366';
            ctx.fillText('Servidor: 10.238.118.104   |   Porta: 7654   |   Usuário: arlindo.santos', 48, 178);

            // Steps Data
            const steps = [
                {
                    num: '1',
                    title: 'Acessar o Servidor via SSH',
                    code: 'ssh arlindo.santos@10.238.118.104 -p 7654'
                },
                {
                    num: '2',
                    title: 'Ir para a Pasta do Site',
                    code: 'cd /var/www/html'
                },
                {
                    num: '3',
                    title: 'Editar o Arquivo index.html',
                    code: 'sudo vi index.html'
                },
                {
                    num: '4',
                    title: 'Comandos Úteis do Editor Vi',
                    lines: [
                        'i     → Entra no modo de edição',
                        'Esc   → Sai do modo de edição',
                        ':wq   → Salva e fecha o arquivo',
                        ':q!   → Sai sem salvar'
                    ]
                }
            ];

            let startY = 215;

            steps.forEach((step) => {
                ctx.fillStyle = '#0055A5';
                ctx.beginPath();
                ctx.arc(50, startY + 15, 16, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 14px "Segoe UI", Arial';
                ctx.textAlign = 'center';
                ctx.fillText(step.num, 50, startY + 20);

                ctx.fillStyle = '#2D3748';
                ctx.font = 'bold 15px "Segoe UI", Arial';
                ctx.textAlign = 'left';
                ctx.fillText(step.title, 80, startY + 20);

                if (step.code) {
                    ctx.fillStyle = '#1E1E1E';
                    roundRect(ctx, 80, startY + 30, 490, 36, 6, true, false);
                    ctx.fillStyle = '#569CD6';
                    ctx.font = '13px "Consolas", monospace';
                    ctx.fillText(step.code, 95, startY + 53);
                    startY += 85;
                } else if (step.lines) {
                    ctx.fillStyle = '#1E1E1E';
                    roundRect(ctx, 80, startY + 30, 490, 95, 6, true, false);
                    ctx.font = '12px "Consolas", monospace';
                    
                    step.lines.forEach((line, idx) => {
                        ctx.fillStyle = '#569CD6';
                        ctx.fillText(line.split('→')[0], 95, startY + 50 + (idx * 20));
                        ctx.fillStyle = '#6A9955';
                        ctx.fillText('→' + line.split('→')[1], 150, startY + 50 + (idx * 20));
                    });
                    startY += 140;
                }
            });

            // Footer
            ctx.fillStyle = '#F7FAFC';
            roundRectBottom(ctx, 0, 690, 600, 50, 16);
            ctx.strokeStyle = '#EDF2F7';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 690);
            ctx.lineTo(600, 690);
            ctx.stroke();

            ctx.fillStyle = '#718096';
            ctx.font = '12px "Segoe UI", Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Agência Estadual de Tecnologia da Informação - ATI PE', 300, 720);
        }

        // Helper Functions
        function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }

        function roundRectTop(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height);
            ctx.lineTo(x, y + height);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        function roundRectBottom(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + width, y);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y);
            ctx.closePath();
            ctx.fill();
        }

        function downloadPNG() {
            const link = document.createElement('a');
            const mode = document.getElementById('modeSelect').value;
            const filename = mode === 'specific' ? 'Manual_ATI_Data.png' : 'Manual_ATI_DiaSemana.png';
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Initialize Canvas
        updateCanvas();
    </script>
</body>
</html>
