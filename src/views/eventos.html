                </div>

                    <label class="font-semibold min-w-0">Tipo<select id="filtro-evento-tipo" class="block w-full mt-1 border rounded-lg p-2 bg-white font-normal"><option value="">Todos os tipos</option></select></label>

                </div>
                <div class="flex flex-wrap justify-between items-center gap-2">

                    <button type="button" id="limpar-filtros-eventos" class="text-xs font-semibold text-blue-900 border rounded-lg px-3 py-2 hover:bg-blue-50">Limpar filtros</button>

                <p id="eventos-filtros-erro" role="alert" class="text-xs text-red-800"></p>
