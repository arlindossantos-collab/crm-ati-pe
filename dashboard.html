<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Sistema</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; }
    .header { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .user-info { font-size: 16px; color: #333; }
    .btn-logout { background-color: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-logout:hover { background-color: #c82333; }
    .content { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="header">
    <div class="user-info">
      Bem-vindo, <strong id="user-display">Carregando...</strong>
    </div>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>

  <div class="content">
    <h2>Painel Principal</h2>
    <p style="margin-top: 10px; color: #666;">Você está autenticado no sistema via Firebase Authentication.</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA2OoAqzaki4ijS_wQDD5T07KKRtVDNl2E",
      authDomain: "prgd-ati-pe.firebaseapp.com",
      projectId: "prgd-ati-pe",
      storageBucket: "prgd-ati-pe.firebasestorage.app",
      messagingSenderId: "798768232646",
      appId: "1:798768232646:web:31b80951f237b4af17bfc7",
      measurementId: "G-MWES9XN421"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();

    // Proteção de Rota: Garante que apenas usuários autenticados acessem a página
    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('user-display').innerText = user.email;
      } else {
        // Redireciona de volta para a tela de login caso não esteja logado
        window.location.href = 'index.html';
      }
    });

    function logout() {
      auth.signOut().then(() => {
        window.location.href = 'index.html';
      });
    }
  </script>
</body>
</html>
