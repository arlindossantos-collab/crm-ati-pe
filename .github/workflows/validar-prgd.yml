name: Validar PRGD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:auth
      - name: Preparar navegador isolado
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar Locais no navegador com Firebase simulado
        run: node tests/locais.browser.cjs
      - name: Testar exclusão, histórico e restauração da sessão
        run: node tests/seguranca-sessao.browser.cjs
      - name: Guardar capturas da interface de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-prgd
          path: test-results/
          if-no-files-found: ignore
