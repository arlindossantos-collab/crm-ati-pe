name: Validar PRGD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:auth
      - name: Preparar navegador isolado
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 tailwindcss@3.4.17
          npx playwright install --with-deps chromium
          npx tailwindcss -i tests/tailwind-input.css --content index.html -o /tmp/prgd-test.css --minify
      - name: Testar Locais no navegador com Firebase simulado
        env:
          PRGD_TEST_CSS: /tmp/prgd-test.css
        run: node tests/locais.browser.cjs
      - name: Testar exclusão, histórico e restauração da sessão
        env:
          PRGD_TEST_CSS: /tmp/prgd-test.css
        run: node tests/seguranca-sessao.browser.cjs
      - name: Testar governança e telas por perfil
        env:
          PRGD_TEST_CSS: /tmp/prgd-test.css
        run: node tests/perfis.browser.cjs
      - name: Testar cadastro e inscrições institucionais
        env:
          PRGD_TEST_CSS: /tmp/prgd-test.css
        run: node tests/inscricoes.browser.cjs
      - name: Testar estabilidade e operação do portal NSI
        env:
          PRGD_TEST_CSS: /tmp/prgd-test.css
        run: node tests/portal-nsi.browser.cjs
      - name: Testar áreas externa e interna por perfil
        env:
          PRGD_TEST_CSS: /tmp/prgd-test.css
        run: node tests/layout-perfis.browser.cjs
      - name: Testar administração de usuários, colaboradores e contatos vinculados
        env:
          PRGD_TEST_CSS: /tmp/prgd-test.css
        run: node tests/usuarios-colaboradores.browser.cjs
      - name: Guardar capturas da interface de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-prgd
          path: test-results/
          if-no-files-found: ignore
