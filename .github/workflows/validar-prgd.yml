name: Validar PRGD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:auth
      - name: Preparar navegador
        run: npx playwright install --with-deps chromium
      - name: Testar todos os módulos no navegador
        env:
          PRGD_TEST_CSS: ${{ github.workspace }}/dist/assets/tailwind.css
        run: npm run test:browser
      - name: Testar artefato com SDK e emuladores reais
        run: npm run test:integration
      - name: Guardar capturas da interface de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-prgd
          path: test-results/
          if-no-files-found: ignore
      - name: Guardar artefato estático revisável
        uses: actions/upload-artifact@v4
        with:
          name: site-prgd
          path: dist/
